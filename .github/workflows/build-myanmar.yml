name: Build CrossInk Myanmar Firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CrossInk
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Ensure Submodules are Initialized
        run: |
          git submodule sync
          git submodule update --init --recursive

      - name: Merge Myanmar Shaping Engine & Assets
        run: |
          git config user.name "HtetWaiAung"
          git config user.email "actions@github.com"
          git remote add myanmar https://github.com/bhonemyinthtoo999-pixel/CrossInk-Myanmar-Edition.git
          git fetch myanmar --tags

          # Checkout directly from the verified RC2 commit hash
          git checkout bde0e23c4d28c26fa79a4a4fab87afc2667840b3 -- \
            lib/HarfBuzzTiny \
            lib/MyanmarRuntimeFont \
            lib/MyanmarShapedCache \
            assets/myanmar_runtime.atlas \
            assets/myanmar_runtime.ttf \
            scripts/build_myanmar_runtime_assets.py \
            lib/I18n/translations/myanmar.yaml

      - name: Fix Language Ordering Conflicts
        run: |
          python3 -c "
          import os, re
          # Recursively find any myanmar.yaml translation file and set _order to 99
          for root, _, files in os.walk('.'):
              for f in files:
                  if f.endswith('.yaml') and 'myanmar' in f:
                      p = os.path.join(root, f)
                      with open(p, 'r', encoding='utf-8', errors='ignore') as fp:
                          data = fp.read()
                      print(f'Found translation file: {p}')
                      # Replace any existing order key with _order: 99
                      data = re.sub(r'[\'\"]?_order[\'\"]?\s*:\s*[\'\"]?\d+[\'\"]?', '_order: 99', data)
                      with open(p, 'w', encoding='utf-8') as fp:
                          fp.write(data)
                      print(f'Successfully updated {p} to _order: 99')
          "

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Compile Firmware for XTEINK X4
        run: pio run -e default

      - name: Upload Firmware Binary Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CrossInk-v1.6.1-Myanmar-X4
          path: .pio/build/default/firmware.bin
