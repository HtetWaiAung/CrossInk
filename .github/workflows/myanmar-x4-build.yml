name: Build Myanmar X4 firmware
on:
  workflow_dispatch:
  push:
    branches: [myanmar-x4]
permissions:
  contents: read
jobs:
  build-x4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify firmware SDK
        run: |
          test -f freeink-sdk/platformio.ini -o -d freeink-sdk/libs/hardware || { echo 'Missing freeink-sdk submodule. Fork original CrossInk with git submodules, then copy Myanmar files into it.'; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install compatible PlatformIO
        run: python -m pip install https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
      - name: Build firmware for XTEINK X4 (default target)
        run: |
          set -o pipefail
          pio run -e default -j1 2>&1 | tee build-x4.log
      - name: Upload firmware and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crossink-myanmar-x4-build
          path: |
            .pio/build/default/*.bin
            .pio/build/default/*.elf
            build-x4.log
          if-no-files-found: warn
